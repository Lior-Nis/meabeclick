<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1080px;height:1080px;direction:rtl;font-family:'Heebo',sans-serif;
       background:#F8FAFC;color:#1E293B;overflow:hidden;position:relative}
  .deco{position:absolute;pointer-events:none}
  .wrap{position:relative;height:100%;padding:56px 64px;display:flex;flex-direction:column;z-index:2}
  h1{font-family:'Secular One',sans-serif;font-size:96px;line-height:1.04;letter-spacing:-.01em}
  h1 .hl{position:relative;display:inline-block;z-index:1}
  h1 .hl::after{content:'';position:absolute;left:-6px;right:-6px;bottom:6px;height:24px;
       background:#FDBA74;z-index:-1;border-radius:4px;transform:rotate(-1deg)}
  .grow{flex:1}
  .foot{display:flex;align-items:center;justify-content:space-between;z-index:3}
  .brand{display:flex;align-items:center;gap:12px;font-family:'Secular One',sans-serif;
       font-size:34px;color:#1E293B}
  .phone{font-family:'Secular One',sans-serif;font-size:38px;color:#1E293B;direction:ltr;
       background:#FA8231;padding:10px 26px;border:4px solid #1E293B;border-radius:999px;
       box-shadow:6px 6px 0 rgba(30,41,59,.2)}
  .tap{font-family:'Secular One',sans-serif;font-size:31px;color:#1E293B;
       background:#FA8231;padding:12px 28px;border:4px solid #1E293B;border-radius:999px;
       box-shadow:6px 6px 0 rgba(30,41,59,.2)}
  
  .stage{position:relative;height:100%;display:flex;flex-direction:column;
         align-items:center;justify-content:center;z-index:2;text-align:center}
  .word{font-family:'Secular One',sans-serif;font-size:104px;line-height:1;margin-top:26px}
  .tag{font-family:'Heebo',sans-serif;font-weight:700;font-size:34px;color:#64748B;margin-top:20px}
  .rule{width:180px;height:6px;background:#FA8231;border-radius:999px;margin-top:28px}
