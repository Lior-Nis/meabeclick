<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="UTF-8"><title>משחקים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F8FAFC;--card:#fff;--text:#1E293B;--muted:#64748B;--brand:#2563EB;
        --cta:#FA8231;--mint:#10B981;--border:#E2E8F0;--accent:#10B981}
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1080px;height:1080px;direction:rtl;font-family:'Heebo',sans-serif;
       background:var(--bg);color:var(--text);overflow:hidden;position:relative}
  body::before{content:'';position:absolute;inset:0;
       background-image:radial-gradient(#E2E8F0 2px,transparent 2px);background-size:34px 34px;opacity:.5}
  .wrap{position:relative;height:100%;padding:74px 80px;display:flex;flex-direction:column}
  .kicker{display:inline-flex;align-self:flex-start;align-items:center;gap:10px;
       background:rgba(250,130,49,.12);border:2px solid var(--cta);color:var(--cta);
       font-size:26px;font-weight:800;padding:12px 28px;border-radius:999px;margin-bottom:34px}
  h1{font-size:86px;font-weight:900;line-height:1.08;letter-spacing:-.02em}
  h1 em{font-style:normal;color:var(--accent)}
  .sub{font-size:35px;color:var(--muted);margin-top:24px;line-height:1.5;font-weight:400}
  .grow{flex:1}
  .foot{display:flex;align-items:center;justify-content:space-between;
        border-top:3px solid var(--border);padding-top:30px}
  .brand{display:flex;align-items:center;gap:14px;font-size:34px;font-weight:900;color:var(--brand)}
  .phone{font-size:34px;font-weight:900;color:var(--cta);direction:ltr}
  .cards{display:grid;gap:22px;margin-top:14px}
  .card{background:var(--card);border:2px solid var(--border);border-radius:26px;
        padding:32px 36px;display:flex;align-items:center;gap:26px}
  .ico{font-size:52px;flex-shrink:0}
  .ct{font-size:38px;font-weight:800;line-height:1.25}
  .cs{font-size:27px;color:var(--muted);margin-top:6px;font-weight:400;line-height:1.4}
  .big{background:var(--card);border:3px solid var(--accent);border-radius:34px;padding:46px 50px;margin-top:10px}
  .big-t{font-size:46px;font-weight:900;color:var(--accent);margin-bottom:18px}
  .big-l{font-size:33px;line-height:1.75;color:var(--text)}
  .big-l span{color:var(--muted)}
  .pill{display:inline-block;background:rgba(37,99,235,.09);border:2px solid rgba(37,99,235,.35);
        color:var(--brand);font-size:31px;font-weight:800;padding:12px 26px;border-radius:999px;margin:0 0 12px 12px}
  .strike{color:var(--muted);text-decoration:line-through;text-decoration-thickness:3px}
</style></head><body><div class="wrap">
  <div class="kicker">🎮 שיעורי בית אחרים</div>
  <h1>לא עוד <span class="strike">דפי עבודה</span><br><em>משחקים אמיתיים</em></h1>
  <div class="cards" style="margin-top:40px">
    <div class="card"><div class="ico">🔍</div><div>
      <div class="ct">ציד טעויות</div>
      <div class="cs">הילד מוצא את השגיאה בפתרון — ולומד למה היא שגיאה</div></div></div>
    <div class="card"><div class="ico">⚡</div><div>
      <div class="ct">קרב מהירות</div>
      <div class="cs">60 שניות של תרגול — הילדים חוזרים לשחק בעצמם</div></div></div>
    <div class="card"><div class="ico">🕵️</div><div>
      <div class="ct">שתי אמיתות ושקר</div>
      <div class="cs">חושף בדיוק איפה ההבנה מתפספסת</div></div></div>
  </div>
  <div class="grow"></div><div class="foot">
  <div class="brand"><svg width="46" height="34" viewBox="6 14 80 60" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14,30 L14,64"/><path d="M76,30 L76,64"/><path d="M14,30 Q30,25 45,33"/>
    <path d="M76,30 Q60,25 45,33"/><path d="M14,64 Q30,58 45,67"/><path d="M76,64 Q60,58 45,67"/>
    <circle cx="45" cy="40" r="15"/></g>
  <polygon points="44,32 44,56 50,50 54,60 60,57 56,47 64,47" fill="#FA8231"/></svg> מאה בקליק</div>
  <div class="phone">054-696-9891</div></div></div></body></html>
