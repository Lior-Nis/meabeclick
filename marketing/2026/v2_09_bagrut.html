<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1080px;height:1080px;direction:rtl;font-family:'Heebo',sans-serif;
       background:#F8FAFC;color:#1E293B;overflow:hidden;position:relative}
  .deco{position:absolute;pointer-events:none}
  .wrap{position:relative;height:100%;padding:56px 64px;display:flex;flex-direction:column;z-index:2}
  h1{font-family:'Secular One',sans-serif;font-size:96px;line-height:1.04;letter-spacing:-.01em}
  h1 .hl{position:relative;display:inline-block;z-index:1}
  h1 .hl::after{content:'';position:absolute;left:-6px;right:-6px;bottom:6px;height:24px;
       background:#FDBA74;z-index:-1;border-radius:4px;transform:rotate(-1deg)}
  .grow{flex:1}
  .foot{display:flex;align-items:center;justify-content:space-between;z-index:3}
  .brand{display:flex;align-items:center;gap:12px;font-family:'Secular One',sans-serif;
       font-size:34px;color:#1E293B}
  .phone{font-family:'Secular One',sans-serif;font-size:38px;color:#1E293B;direction:ltr;
       background:#FA8231;padding:10px 26px;border:4px solid #1E293B;border-radius:999px;
       box-shadow:6px 6px 0 rgba(30,41,59,.2)}
  .tap{font-family:'Secular One',sans-serif;font-size:31px;color:#1E293B;
       background:#FA8231;padding:12px 28px;border:4px solid #1E293B;border-radius:999px;
       box-shadow:6px 6px 0 rgba(30,41,59,.2)}
  
</style></head><body>
  <div class="deco" style="top:-80px;left:-60px;"><svg viewBox="0 0 360 360" style="width:360px;height:360px">
      <circle cx="180" cy="180" r="180" fill="#BFDBFE" opacity=".9"/></svg></div>
  <div class="deco" style="top:120px;left:230px;transform:rotate(12deg)"><svg viewBox="0 0 60 60" style="width:60px;height:60px">
    <path d="M30,6 L36,24 L55,25 L40,36 L46,54 L30,43 L14,54 L20,36 L5,25 L24,24 Z"
      fill="none" stroke="#FA8231" stroke-width="4.5" stroke-linejoin="round"/></svg></div>
  <div class="deco" style="bottom:360px;left:-20px;transform:rotate(-8deg)"><svg viewBox="0 0 160 50" style="width:152px;height:47.5px">
    <path d="M8,34 C34,10 44,44 68,22 C90,2 100,42 124,24 C140,12 148,30 154,26"
      fill="none" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/></svg></div>
  <div class="deco" style="bottom:170px;left:50px;"><svg viewBox="0 0 120 90" style="width:150px;height:112.5px">
    <rect x="14" y="60" width="94" height="18" rx="4" fill="#FA8231" stroke="#1E293B" stroke-width="4"/>
    <rect x="20" y="42" width="82" height="18" rx="4" fill="#FED7AA" stroke="#1E293B" stroke-width="4"/>
    <rect x="26" y="24" width="70" height="18" rx="4" fill="#93C5FD" stroke="#1E293B" stroke-width="4"/>
    <line x1="34" y1="24" x2="34" y2="42" stroke="#1E293B" stroke-width="3"/>
    <line x1="30" y1="42" x2="30" y2="60" stroke="#1E293B" stroke-width="3"/></svg></div>
  <div class="deco" style="top:420px;right:-15px;"><svg viewBox="0 0 100 100" style="width:100px;height:100px">
    <path d="M50,50 C50,42 58,40 62,46 C68,55 58,66 46,64 C30,61 24,44 34,30 C46,13 72,12 85,28"
      fill="none" stroke="#10B981" stroke-width="7" stroke-linecap="round"/></svg></div>
  <div class="wrap">
    <div style="align-self:flex-start;
  background:#FA8231;color:#1E293B;font-family:'Secular One';font-size:30px;padding:12px 30px;
  border:4px solid #1E293B;border-radius:999px;transform:rotate(-2deg);
  box-shadow:6px 6px 0 rgba(30,41,59,.2)">🎓 בגרות במתמטיקה</div>
    <h1 style="margin-top:22px;font-size:76px">3, 4 או 5<br>יחידות —<br><span class="hl">מתחילים מוקדם.</span></h1>
    
  <div style="position:relative;transform:rotate(1.3deg);background:#FFFFFF;padding:30px 38px;
       width:fit-content;align-self:flex-start;
       border:5px solid #1E293B;border-radius:10px;box-shadow:10px 12px 0 rgba(30,41,59,.16)">
    <div style="position:absolute;top:-16px;left:50%;transform:translateX(-50%) rotate(6deg);
  width:110px;height:34px;background:rgba(250,130,49,.30);border:2px solid rgba(30,41,59,.16)"></div><div style="font-size:31px;line-height:1.65;font-weight:700">
        רוב התלמידים מתחילים להתכונן חודשיים לפני המועד.<br>
        <span style="color:#2563EB">מי שמתחיל בספטמבר מגיע למועד בלי לחץ —</span><br>
        כי כל נושא נסגר בזמן שלומדים אותו בכיתה.</div></div>
    <div style="display:flex;gap:13px;margin-top:26px;padding-right:6px">
      <span style="background:#FED7AA;font-family:'Secular One';
  font-size:29px;padding:10px 24px;border:4px solid #1E293B;border-radius:999px;
  transform:rotate(-1.6deg);display:inline-block;box-shadow:4px 5px 0 rgba(30,41,59,.18)">אלגברה</span><span style="background:#93C5FD;font-family:'Secular One';
  font-size:29px;padding:10px 24px;border:4px solid #1E293B;border-radius:999px;
  transform:rotate(1.6deg);display:inline-block;box-shadow:4px 5px 0 rgba(30,41,59,.18)">גאומטריה</span><span style="background:#A7F3D0;font-family:'Secular One';
  font-size:29px;padding:10px 24px;border:4px solid #1E293B;border-radius:999px;
  transform:rotate(-1.2deg);display:inline-block;box-shadow:4px 5px 0 rgba(30,41,59,.18)">טריגונומטריה</span>
    </div>
    <div class="grow"></div>
  <div class="foot"><div class="brand"><svg width="52" height="39" viewBox="6 14 80 60" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14,30 L14,64"/><path d="M76,30 L76,64"/><path d="M14,30 Q30,25 45,33"/>
    <path d="M76,30 Q60,25 45,33"/><path d="M14,64 Q30,58 45,67"/><path d="M76,64 Q60,58 45,67"/>
    <circle cx="45" cy="40" r="15"/></g>
  <polygon points="44,32 44,56 50,50 54,60 60,57 56,47 64,47" fill="#FA8231"/></svg> מאה בקליק</div>
    <div class="tap">לפרטים נוספים — לחצו על הקישור 👆</div></div>
  </div></body></html>
