<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <!-- Comments here are served on every request, so keep them short.
         The reasoning lives in tests/unit/app-html.test.mjs.
         viewport-fit=cover: without it env(safe-area-inset-*) is 0 and the
         student board's fixed nav sits under the iPhone home indicator.
         theme-color: one per document — only the first counts.
         Never write a SvelteKit placeholder here, not even in a comment. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <link rel="icon" href="/images/favicon.svg" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
